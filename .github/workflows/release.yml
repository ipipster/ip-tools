name: Release

# Push a tag like "meet-ringer-v1.1.1" to build the zip and publish a GitHub Release.
on:
  push:
    tags: ['*-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read tool and version from the tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tool=${TAG%-v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*-v}" >> "$GITHUB_OUTPUT"
      - name: Build Meet Ringer package
        if: steps.tag.outputs.tool == 'meet-ringer'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          SRC=tools/meet-ringer/extension
          CODE_VERSION=$(node -p "require('./$SRC/manifest.json').version")
          if [ "$CODE_VERSION" != "$VERSION" ]; then
            echo "Tag version $VERSION does not match manifest.json version $CODE_VERSION"; exit 1
          fi
          python3 scripts/meet_ringer_helper.py --check
          mkdir -p dist/pkg
          cp -r "$SRC" dist/pkg/meet-ringer
          (cd dist/pkg && zip -r "../meet-ringer-$VERSION.zip" meet-ringer)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls dist/*.zip >/dev/null 2>&1 || { echo "No package built for tool '${{ steps.tag.outputs.tool }}'"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "${{ steps.tag.outputs.tool }} ${{ steps.tag.outputs.version }}" \
            --notes "See tools/${{ steps.tag.outputs.tool }}/CHANGELOG.md. Install steps: tools/${{ steps.tag.outputs.tool }}/README.md"
